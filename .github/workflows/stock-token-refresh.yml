name: Refresh stock token registry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stock-token-refresh.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-token-registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh production registry
        env:
          STOCK_TOKEN_CRON_SECRET: ${{ secrets.STOCK_TOKEN_CRON_SECRET }}
        run: |
          args=(--fail-with-body --silent --show-error --retry 1 --max-time 75)
          if [ -n "$STOCK_TOKEN_CRON_SECRET" ]; then
            args+=(--header "Authorization: Bearer $STOCK_TOKEN_CRON_SECRET")
          fi
          providers=(bybit-xstocks gate-stock-tokens robinhood-stock-tokens okx-stock-tokens kraken-stock-tokens)
          successes=0
          for provider in "${providers[@]}"; do
            if curl "${args[@]}" "https://btcaipro.vercel.app/api/stock-tokens/refresh?provider=$provider"; then
              successes=$((successes + 1))
            else
              echo "Provider refresh failed: $provider" >&2
            fi
          done
          if [ "$successes" -eq 0 ]; then
            echo "Every stock-token provider refresh failed" >&2
            exit 1
          fi
