name: Refresh stock token registry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stock-token-refresh.yml
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-token-registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh production registry
        env:
          STOCK_TOKEN_CRON_SECRET: ${{ secrets.STOCK_TOKEN_CRON_SECRET }}
        run: |
          args=(--fail-with-body --silent --show-error --retry 1 --max-time 75)
          if [ -n "$STOCK_TOKEN_CRON_SECRET" ]; then
            args+=(--header "Authorization: Bearer $STOCK_TOKEN_CRON_SECRET")
          fi
          # Active production sources only; Bybit remains independently unavailable.
          providers=(gate-stock-tokens robinhood-stock-tokens)
          failures=0
          for provider in "${providers[@]}"; do
            if result=$(curl "${args[@]}" "https://www.btcaipro.com/api/stock-tokens/refresh?provider=$provider"); then
              echo "$result" | jq '{ok, skipped, providers, health: {active: .health.active, stale: .health.stale, lastPriceUpdateAt: .health.lastPriceUpdateAt}}'
              if ! echo "$result" | jq -e --arg provider "$provider" '.ok == true and (.skipped == "refresh_in_progress" or any(.providers[]?; .provider == $provider and .status == "ok" and .discovered > 0))' >/dev/null; then
                failures=$((failures + 1))
              fi
            else
              echo "Provider refresh failed: $provider" >&2
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "An active production provider failed to refresh" >&2
            exit 1
          fi
